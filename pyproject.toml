[project]
name = "face-onnx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "onnxruntime>=1.23.2",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
rknn = ["rknn-toolkit-lite2==2.3.2; platform_machine == 'aarch64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: processes every input frame"]
